<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Project Generator</title>
</head>
<body>
    <body>
  <header class="content">
    <h1>AI Poem Generator</h1>
    <h2>Generate beautiful poems on any topic</h2>
  </header>
  <main class="info-box">
<form id="poem-generator-form">
  <input type="text" placeholder="Enter the topic of poem" required />
  <input type="submit" class="submit-button" value="Generate Poem" />
</form>
<div class="loading" style="display:none;">✨ Crafting your poem...</div>
<div id="poem"></div>
<button id="copyBtn" style="display:none;">📋 Copy Poem</button>
  </main>
